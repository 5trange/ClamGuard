name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            search_dir: "install/dist"
            artifact_glob: "ClamGuard-Setup*.exe"
            asset_name: ClamGuard-Setup-windows-x64.exe
          - os: ubuntu-latest
            search_dir: "dist"
            artifact_glob: "ClamGuard-*.AppImage"
            asset_name: ClamGuard-linux-x86_64.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup -y
        shell: cmd

      - name: Build executable
        run: uv run python build.py production

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p release
          src=$(find "${{ matrix.search_dir }}" -type f -iname "${{ matrix.artifact_glob }}" | head -n 1)
          if [ -z "$src" ]; then
            echo "No file matching ${{ matrix.artifact_glob }} found in ${{ matrix.search_dir }}"
            find "${{ matrix.search_dir }}" -type f
            exit 1
          fi
          cp "$src" "release/${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact folders
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;

      - name: List release files
        run: ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
